[workspace]
resolver = "2"
members = ["crates/kagura-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
# 0.63.x 是 2026-11-23 的最新版；只用内嵌 schema，不需要远程/文件解析
jsonschema = { version = "0.63", default-features = false }

[workspace.lints]
clippy.all = "warn"
rust.unsafe_code = "forbid"
