[package]
name = "kagura-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Kagura 资产库核心：命名、路径、manifest、schema 校验"

[features]
# EditPatch's deserialize_with hooks distinguish missing and null; its TS shape is tested explicitly.
bindings = ["dep:ts-rs", "ts-rs/no-serde-warnings"]

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dunce = "1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
jsonschema.workspace = true
unicase = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
ts-rs = { version = "12.0.1", optional = true, features = ["serde-json-impl"] }

[dev-dependencies]
sha2 = "0.10"

[lints]
workspace = true
